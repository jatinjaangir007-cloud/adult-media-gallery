<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>VelvetHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --red:#e8000e;--red2:#ff1a27;
      --bg:#080808;--bg2:#101010;--bg3:#161616;--bg4:#1c1c1c;
      --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.10);
      --text:#f2f2f2;--muted:#888;--muted2:#555;
      --nav-h:60px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
    a{text-decoration:none;color:inherit;}

    /* ── Navbar ── */
    .navbar{
      position:sticky;top:0;z-index:100;
      height:var(--nav-h);
      background:rgba(8,8,8,0.96);
      border-bottom:1px solid var(--border);
      backdrop-filter:blur(14px);
    }
    .nav-inner{
      max-width:1200px;margin:0 auto;padding:0 20px;
      height:100%;display:flex;align-items:center;gap:16px;
    }
    .back-btn{
      display:flex;align-items:center;gap:7px;
      background:rgba(255,255,255,0.04);
      border:1px solid var(--border2);
      color:#bbb;padding:8px 15px;border-radius:7px;
      font-size:13px;font-weight:500;font-family:inherit;
      cursor:pointer;transition:all 0.2s;
      flex-shrink:0;
    }
    .back-btn:hover{background:rgba(255,255,255,0.08);color:#fff;border-color:rgba(255,255,255,0.18);}
    .nav-logo{font-size:19px;font-weight:900;letter-spacing:0.3px;}
    .nav-logo span{color:var(--red);}

    /* ── View wrapper ── */
    .view-wrap{
      max-width:1000px;margin:0 auto;
      padding:28px 20px 80px;
    }

    /* ── Video Player ── */
    .video-container{
      width:100%;background:#000;
      border-radius:12px;overflow:hidden;
      box-shadow:0 10px 50px rgba(0,0,0,0.8),
                 0 0 0 1px var(--border);
      position:relative;
    }
    .video-container video{
      width:100%;max-height:72vh;
      display:block;background:#000;
    }

    /* ── Image Viewer ── */
    .image-container{
      width:100%;background:#000;
      border-radius:12px;overflow:hidden;
      box-shadow:0 10px 50px rgba(0,0,0,0.8),
                 0 0 0 1px var(--border);
      cursor:zoom-in;
      position:relative;
    }
    .image-container img{
      width:100%;max-height:80vh;
      object-fit:contain;display:block;
    }
    .zoom-hint{
      position:absolute;bottom:12px;right:14px;
      background:rgba(0,0,0,0.6);
      border:1px solid var(--border2);
      color:#999;font-size:11px;
      padding:4px 10px;border-radius:20px;
      backdrop-filter:blur(6px);
      pointer-events:none;
    }

    /* ── Fullscreen Overlay ── */
    .fs-overlay{
      display:none;position:fixed;inset:0;
      background:rgba(0,0,0,0.97);z-index:1000;
      align-items:center;justify-content:center;
      cursor:zoom-out;
    }
    .fs-overlay.open{display:flex;}
    .fs-overlay img{
      max-width:96vw;max-height:96vh;
      object-fit:contain;border-radius:4px;
      user-select:none;
    }
    .fs-close{
      position:fixed;top:16px;right:18px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.12);
      color:#ccc;width:42px;height:42px;
      border-radius:50%;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      font-size:16px;z-index:1001;
      transition:background 0.2s,color 0.2s;
    }
    .fs-close:hover{background:var(--red);color:#fff;border-color:var(--red);}

    /* ── Meta ── */
    .meta{
      margin-top:22px;
      background:var(--bg2);
      border:1px solid var(--border);
      border-radius:12px;
      padding:20px;
    }

    .meta-header{
      display:flex;align-items:flex-start;
      justify-content:space-between;gap:16px;
      margin-bottom:14px;
    }

    .meta h1{
      font-size:clamp(17px,3vw,22px);
      font-weight:800;line-height:1.35;
      background:linear-gradient(135deg,#fff,rgba(255,255,255,0.8));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }

    .meta-type-badge{
      flex-shrink:0;
      font-size:11px;font-weight:700;
      text-transform:uppercase;letter-spacing:0.7px;
      padding:4px 12px;border-radius:6px;
      margin-top:3px;
    }
    .type-video{background:rgba(232,0,14,0.15);color:var(--red);border:1px solid rgba(232,0,14,0.25);}
    .type-image{background:rgba(0,102,220,0.15);color:#4d9fff;border:1px solid rgba(0,102,220,0.25);}

    .meta-info-row{
      display:flex;align-items:center;gap:8px;
      margin-bottom:14px;
    }
    .meta-info-row span{font-size:12px;color:var(--muted2);}
    .meta-sep{color:var(--muted2);}

    .tag-list{
      display:flex;flex-wrap:wrap;gap:7px;
    }
    .tag{
      background:rgba(255,255,255,0.04);
      border:1px solid var(--border2);
      color:#aaa;
      padding:5px 13px;border-radius:20px;
      font-size:12px;font-weight:500;
      cursor:pointer;transition:all 0.2s;
    }
    .tag:hover{
      background:rgba(232,0,14,0.12);
      color:var(--red2);
      border-color:rgba(232,0,14,0.3);
    }

    /* ── Skeleton ── */
    .skeleton{
      background:linear-gradient(90deg,#141414 25%,#1e1e1e 50%,#141414 75%);
      background-size:200% 100%;
      animation:shimmer 1.5s infinite;
      border-radius:12px;height:440px;
    }
    .skeleton-meta{
      margin-top:22px;background:var(--bg2);
      border:1px solid var(--border);border-radius:12px;padding:20px;
    }
    .skeleton-line{
      height:13px;border-radius:4px;margin-bottom:10px;
      background:linear-gradient(90deg,#141414 25%,#1e1e1e 50%,#141414 75%);
      background-size:200% 100%;animation:shimmer 1.5s infinite;
    }
    .skeleton-line.w80{width:80%;}
    .skeleton-line.w50{width:50%;}
    .skeleton-line.w30{width:30%;}
    @keyframes shimmer{
      0%{background-position:200% 0;}
      100%{background-position:-200% 0;}
    }

    /* ── Error ── */
    .error-box{
      text-align:center;padding:80px 20px;
    }
    .error-box .err-ico{
      font-size:52px;margin-bottom:16px;opacity:0.4;
    }
    .error-box h2{
      font-size:20px;color:var(--red);margin-bottom:10px;
    }
    .error-box p{color:var(--muted2);margin-bottom:20px;}
    .error-box a{
      background:var(--red);color:#fff;
      padding:10px 22px;border-radius:8px;
      font-size:13px;font-weight:600;
      transition:background 0.2s;
    }
    .error-box a:hover{background:var(--red2);}

    @media(max-width:600px){
      .view-wrap{padding:16px 12px 50px;}
      .nav-inner{padding:0 12px;}
      .meta{padding:14px;}
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="nav-inner">
    <button class="back-btn" onclick="history.length>1?history.back():window.location.href='/'">
      &#8592; Back
    </button>
    <a class="nav-logo" href="/">Velvet<span>Hub</span></a>
  </div>
</nav>

<!-- Main content -->
<div class="view-wrap">
  <div id="content">
    <div class="skeleton"></div>
    <div class="skeleton-meta">
      <div class="skeleton-line w80"></div>
      <div class="skeleton-line w50"></div>
      <div class="skeleton-line w30"></div>
    </div>
  </div>
</div>

<!-- Fullscreen image overlay -->
<div class="fs-overlay" id="fsOverlay">
  <button class="fs-close" id="fsClose">&#10005;</button>
  <img id="fsImg" src="" alt="">
</div>

<script>
const params  = new URLSearchParams(window.location.search);
const mediaId = params.get('id');
const content = document.getElementById('content');

async function load() {
  if (!mediaId) { showError('No media ID provided.'); return; }
  try {
    const res = await fetch(`/api/public/media/${mediaId}`);
    if (!res.ok) throw new Error('Not found');
    const media = await res.json();
    document.title = `${media.title} — VelvetHub`;
    render(media);
  } catch(e) {
    showError('This media could not be found or has been removed.');
  }
}

function render(media) {
  const isVideo = media.fileType === 'video';
  const date    = media.createdAt ? new Date(media.createdAt).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}) : '';

  const tagsHtml = (media.tags && media.tags.length)
    ? media.tags.map(t=>`<a class="tag" href="/?search=${encodeURIComponent(t)}">#${t}</a>`).join('')
    : '';

  let mediaHtml = '';
  if (isVideo) {
    mediaHtml = `
      <div class="video-container">
        <video
          src="${media.fileUrl}"
          controls autoplay
          controlsList="nodownload"
          preload="auto" playsinline
        ></video>
      </div>`;
  } else {
    mediaHtml = `
      <div class="image-container" id="imgWrap">
        <img src="${media.fileUrl}" alt="${esc(media.title)}" id="mainImg" loading="eager">
        <span class="zoom-hint">🔍 Click to expand</span>
      </div>`;
  }

  content.innerHTML = `
    ${mediaHtml}
    <div class="meta">
      <div class="meta-header">
        <h1>${esc(media.title)}</h1>
        <span class="meta-type-badge ${isVideo?'type-video':'type-image'}">${isVideo?'Video':'Photo'}</span>
      </div>
      <div class="meta-info-row">
        ${date ? `<span>${date}</span>` : ''}
        ${media.tags?.length ? `<span class="meta-sep">•</span><span>${media.tags.length} tag${media.tags.length!==1?'s':''}</span>` : ''}
      </div>
      ${tagsHtml ? `<div class="tag-list">${tagsHtml}</div>` : ''}
    </div>
  `;

  if (!isVideo) {
    const wrap      = document.getElementById('imgWrap');
    const fsOverlay = document.getElementById('fsOverlay');
    const fsImg     = document.getElementById('fsImg');
    const fsClose   = document.getElementById('fsClose');

    wrap.addEventListener('click', () => {
      fsImg.src = media.fileUrl;
      fsOverlay.classList.add('open');
    });
    fsClose.addEventListener('click', () => fsOverlay.classList.remove('open'));
    fsOverlay.addEventListener('click', e => {
      if (e.target === fsOverlay) fsOverlay.classList.remove('open');
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') fsOverlay.classList.remove('open');
    });
  }
}

function showError(msg) {
  content.innerHTML = `
    <div class="error-box">
      <div class="err-ico">⚠️</div>
      <h2>Content Not Found</h2>
      <p>${msg}</p>
      <a href="/">Back to Gallery</a>
    </div>`;
}

function esc(s){
  return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

load();
</script>
</body>
</html>
